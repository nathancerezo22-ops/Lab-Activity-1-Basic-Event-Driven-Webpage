<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Basic Event-Driven Webpage</title>

    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>
</head>

<body>

    <div id="pageContainer">

        <h1 id="mainHeading">
            Welcome to My Interactive Webpage
        </h1>

        <input
            type="text"
            id="nameInput"
            placeholder="Enter your name"
        >

        <div class="buttons">

            <button id="greetingButton">
                Display Greeting
            </button>

            <button id="backgroundButton">
                Change Background
            </button>

            <button id="resetButton">
                Reset
            </button>

        </div>

        <p id="messageArea">
            Enter your name and choose an action.
        </p>

    </div>

</body>

</html>
